syntax = "proto2";
package tzrec.protos;

import "tzrec/protos/module.proto";
import "tzrec/protos/simi.proto";
import "tzrec/protos/tower.proto";
import "tzrec/protos/models/multi_task_rank.proto";


message RocketLaunching {
    optional MLP share_mlp = 1;
    required MLP booster_mlp =2;
    required MLP light_mlp = 3;
    optional bool feature_based_distillation = 5 [default = false];
    // COSINE = 0; EUCLID = 1;
    optional Similarity feature_distillation_function = 6 [default=COSINE];
}

message RocketLaunching2 {
    optional MLP share_mlp = 1;
    // Booster: CrossV2 -> Deep MLP (serial)
    required CrossV2 cross = 2;
    required MLP deep = 3;
    // Light: simple MLP (student, learns from booster deep)
    required MLP light_mlp = 4;
    // Distillation config
    optional bool feature_based_distillation = 5 [default = false];
    // COSINE = 0; EUCLID = 1;
    optional Similarity feature_distillation_function = 6 [default = COSINE];
}

message LHUCRocketLaunching {
    optional MLP share_mlp = 1;
    // Booster: DCNv2 parallel bottom + LHUC + Task MLP
    optional MLP bottom_mlp = 2;
    required CrossV2 dcnv2 = 3;
    optional LHUCEPGateConfig lhuc_gate = 4;
    required MLP booster_mlp = 5;
    // Light: simple MLP (student)
    required MLP light_mlp = 6;
    // Distillation config
    optional bool feature_based_distillation = 7 [default = false];
    // COSINE = 0; EUCLID = 1;
    optional Similarity feature_distillation_function = 8 [default = COSINE];
    // LHUC PP net config (requires lhuc_gate for bias features)
    optional LHUCPPNetConfig lhuc_pp_net = 9;
}

// AGE (Adversarial Gradient Driven Exploration) exploration config.
// Reference: KDD 2022 - "Adversarial Gradient Driven Exploration for Deep Click-Through Rate Prediction"
message AGEExplorationConfig {
    // Whether to enable AGE exploration at inference time
    optional bool enable = 1 [default = false];

    // Uncertainty estimation method: UCB (standard deviation) or TS (Thompson Sampling)
    // UCB: uses std of multiple dropout outputs
    // TS: uses single dropout output minus mean
    optional string uncertainty_method = 2 [default = "TS"];

    // Dropout rate for MC Dropout (default 0.01 as per paper)
    optional float dropout_rate = 3 [default = 0.01];

    // Number of dropout samples for UCB (default 20 as per paper)
    optional uint32 num_dropout_samples = 4 [default = 20];

    // Adversarial gradient method: FGM (single step) or PGD (multi-step)
    // PGD is recommended (2.9% better in paper experiments)
    optional bool use_pgd = 5 [default = true];

    // Number of PGD steps (default 5 as per paper)
    optional uint32 pgd_steps = 6 [default = 5];

    // Perturbation epsilon (step size):
    // - Offline: 1e-3 (as per paper)
    // - Online: 2e-3 (as per paper)
    optional float epsilon = 7 [default = 0.002];

    // Feature group name for DGU (Dynamic Gating Unit) item-only network
    // The group must be defined in feature_groups at model config level
    // This is the recommended way - cleaner than listing individual feature names
    optional string item_feature_group = 9;

    // Feature names used for DGU item-only network (legacy way)
    // Only used when item_feature_group is not set
    repeated string item_feature_names = 8;

    // Whether to use soft gating (0~1) instead of hard binary gating (0/1)
    optional bool soft_gate = 10 [default = false];

    // Task tower name to apply exploration (e.g., "is_click")
    // If empty, applies to all tasks
    optional string explore_task = 11;
}

message LHUCRocketLaunchingMT {
    // ===== Booster (teacher, training only) =====
    // Booster mirrors DBMTL_LHUC: DCNv2 parallel bottom + LHUC + MMoE +
    // task towers (with Bayes relation nets) + optional bias heads.
    optional MaskNetModule mask_net = 1;
    optional MLP bottom_mlp = 2;
    required CrossV2 dcnv2 = 3;
    optional MLP expert_mlp = 4;
    optional MLP gate_mlp = 5;
    optional uint32 num_expert = 6 [default = 3];
    optional LHUCEPGateConfig lhuc_gate = 7;
    optional LHUCPPNetConfig lhuc_pp_net = 8;
    // task_towers define the shared multi-task structure for BOTH booster
    // and light (tower_name / label_name / losses / num_class / weight).
    repeated BayesTaskTower task_towers = 9;
    optional SampleWeightFusion sample_weight_fusion = 10;
    // bias auxiliary task heads (booster only)
    repeated BiasTask bias_tasks = 11;

    // ===== Light (student, training + inference) =====
    optional MLP share_mlp = 20;
    required MLP light_mlp = 21;
    // optional per-tower light head MLP; when set, its hidden_units may align
    // with each task_tower.mlp for feature-based distillation.
    optional MLP light_task_mlp = 22;

    // ===== Distillation =====
    optional bool feature_based_distillation = 30 [default = false];
    // COSINE = 0; EUCLID = 1;
    optional Similarity feature_distillation_function = 31 [default = COSINE];
    // weight applied to per-tower logit hint (MSE) loss
    optional float hint_loss_weight = 32 [default = 1.0];

    // ===== AGE Exploration (inference only) =====
    optional AGEExplorationConfig age_exploration = 40;
}

// Per-tower logit hint distillation loss type.
enum HintLossType {
    // L2 (MSE) between light and booster logits (legacy default).
    HINT_MSE = 0;
    // Binary cross-entropy with logits: sigmoid(booster logit) as soft
    // target, light logit as prediction. Use for binary tasks so the hint
    // gradient matches the task-loss (BCE) landscape.
    HINT_BCE = 1;
}

// MTLRocketLaunching per-task distillation weight override; matched to
// task_towers by tower_name. A field left unset falls back to the corresponding
// model-level value on MTLRocketLaunching.
message TaskDistillWeight {
    // tower_name this override applies to (must match a task_towers entry)
    required string tower_name = 1;
    // overrides MTLRocketLaunching.hint_loss_weight for this tower
    optional float hint_loss_weight = 2;
    // overrides MTLRocketLaunching.feature_distillation_weight (COSINE branch)
    optional float feature_distillation_weight = 3;
    // overrides MTLRocketLaunching.hint_loss_type for this tower
    optional HintLossType hint_loss_type = 4;
}

message MTLRocketLaunching {
    // ===== Shared bottom (booster & light; light uses detached output so
    // share_mlp gradients flow only from the booster) =====
    optional MLP share_mlp = 1;

    // ===== Booster (teacher, training only) trunk. All stages are OPTIONAL so
    // the trunk can be freely composed, e.g.:
    //   cross -> deep -> ple -> towers   (full)
    //   deep -> ple -> towers            (no cross)
    //   cross -> deep -> towers          (no ple)
    //   ple -> towers / deep -> towers / ... (any subset; even no trunk)
    // The trunk is applied in order: cross -> deep -> ple. =====
    optional CrossV2 cross = 2;
    optional MLP deep = 3;
    // stacked PLE / CGC extraction networks (empty = skip ple)
    repeated ExtractionNetwork extraction_networks = 4;
    // parallel multi-task towers, e.g. ctr_tower + cvr_tower; the declaration
    // is shared by booster and light (tower_name / label_name / losses / weight).
    repeated TaskTower task_towers = 5;

    // ===== Light (student, training + inference): share.detach() -> light_mlp
    // -> per-tower heads. Only light is served online. =====
    required MLP light_mlp = 20;
    // optional per-tower light head MLP
    optional MLP light_task_mlp = 21;

    // ===== Distillation (mirrors RocketLaunching2) =====
    optional bool feature_based_distillation = 30 [default = false];
    // COSINE = 0; EUCLID = 1; aligns light_mlp hidden layers with booster deep
    optional Similarity feature_distillation_function = 31 [default = COSINE];
    // weight applied to per-tower logit hint (MSE) loss
    optional float hint_loss_weight = 32 [default = 1.0];
    // global feature-based similarity (COSINE) distillation weight; per-tower
    // overrides via task_distill_weights take precedence. Default -0.1 preserves
    // the previous hardcoded behavior.
    optional float feature_distillation_weight = 33 [default = -0.1];
    // per-task distillation weight overrides, matched to task_towers by tower_name
    repeated TaskDistillWeight task_distill_weights = 34;
    // global per-tower logit hint loss type (HINT_MSE default for back-compat);
    // per-tower override via task_distill_weights.hint_loss_type
    optional HintLossType hint_loss_type = 35 [default = HINT_MSE];
}

// MTLRocketLaunching2: variant of MTLRocketLaunching that (1) drops the PLE/CGC
// extraction networks (all task towers read the same cross/deep parallel
// trunk) and (2) supports per-tower input detach so a tower's direct
// supervision does not update the shared bottom (share/cross/deep/light_mlp).
// Typical use: CTR tower updates the bottom normally, CVR tower is detached and
// (via task_space_indicator_label) only learns on clicked samples.
message MTLRocketLaunching2 {
    // ===== Shared bottom (booster & light; light uses detached output) =====
    optional MLP share_mlp = 1;

    // ===== Booster trunk: cross & deep run in PARALLEL from share, each with
    // its own LayerNorm; outputs are concatenated -> task towers (NO PLE). =====
    optional CrossV2 cross = 2;
    optional MLP deep = 3;
    // parallel multi-task towers, shared by booster and light
    repeated TaskTower task_towers = 5;

    // ===== Light (student, training + inference): share.detach() -> light_mlp
    // -> per-tower heads. Only light is served online. =====
    required MLP light_mlp = 20;
    optional MLP light_task_mlp = 21;

    // ===== Distillation (same fields/defaults as MTLRocketLaunching) =====
    optional bool feature_based_distillation = 30 [default = false];
    // COSINE = 0; EUCLID = 1;
    optional Similarity feature_distillation_function = 31 [default = COSINE];
    // weight applied to per-tower logit hint loss
    optional float hint_loss_weight = 32 [default = 1.0];
    optional float feature_distillation_weight = 33 [default = -0.1];
    repeated TaskDistillWeight task_distill_weights = 34;
    optional HintLossType hint_loss_type = 35 [default = HINT_MSE];

    // Towers whose input is detached from the trunk (booster) / light_rep
    // (light), so their direct supervision (task loss + distillation hint)
    // does NOT update share/cross/deep/light_mlp. The tower's own task mlp +
    // linear still learn. Typically the CVR tower; the CTR tower keeps
    // updating the bottom normally.
    repeated string detached_tower_names = 36;
}

// ====================================================================
// SDCL Rocket Launching (sdcl_rocket_launching)
// ANSL (Adaptive Negative Sample Learning) on the light (pre-ranking) net.
// No detach (joint training, shared bottom). Logit BCE distillation (Eq.5).
// Ref: SDCL (AAAI 2025).
// ====================================================================

// Negative Sample Gate Unit (Eq.6): g = x ⊙ Gate(x). Gate is a residual-free
// MLP whose LAST linear is zero-initialized (Gate = alpha/2 everywhere at
// start); e.g. hidden_units 256 + 128 (two lines) builds
// Linear(in->256) -> ReLU -> Linear(256->128) -> ReLU -> Linear(128->in).
message NSGate {
    // gate MLP hidden layer widths, one line per layer (MLP-style). A single
    // value keeps the one-bottleneck form Linear(in->h) -> ReLU ->
    // Linear(h->in); if unset, resolved to [input_dim // 4] at build time.
    repeated uint32 hidden_units = 1;
    // scale alpha; Gate ∈ [0, alpha]. PEPNet-style default 2.0.
    optional float alpha = 2 [default = 2.0];
    // per-task gates: each light task tower gets its OWN gate instead of
    // sharing one (click vs cvr want different feature selection; the
    // gates are light-side params, trained by that task's light losses
    // only). The gate applies to the TASK TOWER INPUT: directly on the
    // (detached) shared bottom when light_mlp is absent, or after the
    // shared light_mlp when present (PEPNet-style, avoids running
    // light_mlp once per task). Zero-init keeps Gate = alpha/2 at start
    // for every task, so warmstarting from a shared-gate checkpoint does
    // not disturb the served distribution. Default false = one shared
    // gate (original SDCL Eq.6).
    optional bool per_task = 3 [default = false];
}

// Per-task Weighted Contrastive Loss config. A tower gets WCL only if listed
// in SDCLRocketLaunching.task_wcl_weights (opt-in).
message TaskWCLWeight {
    required string tower_name = 1;
    // master switch (set false to disable a listed tower).
    optional bool enable = 2 [default = true];
    // per-task β_w^t (Eq.7). Multiplied with the model-level wcl_weight
    // (α_w, Eq.2); defaults to 1.0 when unset.
    optional float weight = 3;
    // # negatives sampled per task per batch (N).
    optional uint32 num_negatives = 4;
    // temperature τ.
    optional float temperature = 5;
    // scale δ for adaptive weight.
    optional float delta = 6;
    // Removed 2026-08-24: hard_negative_pool_size (ANSL hard-negative
    // shortlist, booster-scored top-H) -- falsified by run-6: selecting
    // negatives by the booster score targets the same "click-like" cluster
    // the positives live in, and the Eq.7 suppression landed on the whole
    // cluster through the shared light head (light click AUC inverted to
    // 0.43 and kept falling; see docs/sdcl_rocket_launching_dev.md §10).
    reserved 7;
    reserved "hard_negative_pool_size";
}

message SDCLRocketLaunching {
    // ===== Shared bottom (booster & light, jointly trained; NO detach) =====
    optional MLP share_mlp = 1;

    // ===== Booster trunk (ranking net, training only) — same as v2 =====
    optional CrossV2 cross = 2;
    optional MLP deep = 3;
    repeated TaskTower task_towers = 5;

    // ===== Light (pre-ranking net, training + inference) =====
    // optional light trunk; when omitted, the (gated) share feeds the light
    // heads directly (via light_task_mlp when that is set).
    optional MLP light_mlp = 20;
    optional MLP light_task_mlp = 21;
    // Negative Sample Gate Unit on the light input (Eq.6). If unset, no gate.
    optional NSGate ns_gate = 37;

    // ===== Distillation (logit BCE = Eq.5; NO feature_based_sim) =====
    optional float hint_loss_weight = 32 [default = 1.0];
    repeated TaskDistillWeight task_distill_weights = 34;
    optional HintLossType hint_loss_type = 35 [default = HINT_BCE];

    // ===== Weighted Contrastive Loss (Eq.7+8), light only =====
    // α_w: total WCL weight in Eq.2 (multiplies every task's WCL term).
    optional float wcl_weight = 38 [default = 0.1];
    optional uint32 wcl_num_negatives = 39 [default = 8];
    optional float wcl_temperature = 40 [default = 0.1];
    optional float wcl_delta = 41 [default = 1.0];
    // opt-in per-task WCL config (a tower gets WCL only if listed here).
    repeated TaskWCLWeight task_wcl_weights = 42;
    // Removed 2026-08-24: wcl_standardize_logit (batch z-score of the light
    // logits before Eq.7) -- KNOWN-HARMFUL and never enabled in any kept
    // config (smoke trains 2026-08-20, three rounds: the scale-free,
    // within-batch-only objective with a 1/σ̂ gradient amplifier drove the
    // pooled eval AUC to exactly 0.500). Field number and name reserved.
    reserved 43;
    reserved "wcl_standardize_logit";
    // Additive logit margin for the Eq.7 InfoNCE (raw logit units). A
    // pair's gradient decays to ~0 once p - n >= margin + τ·log(Σ_z w_iz):
    // margin > 0 hardens the separation demand, margin < 0 acts as a
    // tolerance that relaxes the saturation threshold toward the data's
    // discriminative scale (the default threshold τ·log(Σw) is ~1.4σ at
    // N=32, w̄≈0.5, τ=0.5).
    optional float wcl_margin = 44 [default = 0.0];
    // Removed 2026-08-24: wcl_hard_negative_pool_size (model-level default
    // for TaskWCLWeight.hard_negative_pool_size) together with the task
    // field -- falsified by run-6, see TaskWCLWeight.hard_negative_pool_size
    // note above.
    reserved 46;
    reserved "wcl_hard_negative_pool_size";

    // Towers whose BOOSTER-side input is detached from the trunk (cross/deep/
    // share), so their task loss does NOT update the shared bottom -- the
    // bottom is then trained by the remaining towers only (e.g. click-only,
    // the v3 baseline booster recipe). Unlike MTLRocketLaunching2 the LIGHT
    // side is NOT detached: the listed towers' light heads still update
    // ns_gate / light_mlp, keeping the light-side multi-task signal.
    // The listed tower's own booster task mlp + linear still learn.
    repeated string detached_tower_names = 45;
}

// ====================================================================
// SDCL MaskNet + SwiGLU (sdcl_masknet_swish)
// Same distillation/WCL/NSGate machinery as SDCLRocketLaunching; the
// booster trunk replaces the CrossV2||Deep parallel pair with a MaskNet
// (serial or parallel MaskBlocks, use_parallel), and ALL MLPs (MaskBlock
// ffn via mask_block.ffn_activation, task/light/share/top MLPs via
// MLP.activation) may switch to the gated SwiGLU activation
// (SwiGLU(a,b) = SiLU(a) ⊗ sigmoid(b); set activation: "SwiGLU").
// Motivation: a stronger booster trunk lifts the distillation ceiling
// for the served light net.
// Ref: SDCL (AAAI 2025); MaskNet (Facebook, 2020); SwiGLU (Shazeer, 2020).
// ====================================================================
message SDCLMasknetSwish {
    // ===== Shared bottom (booster & light, jointly trained; NO detach) =====
    optional MLP share_mlp = 1;

    // ===== Booster trunk: MaskNet (replaces CrossV2 || Deep) =====
    // Input LayerNorm is built into MaskNetModule; serial (use_parallel:
    // false, output = mask_block.hidden_dim) or parallel (output =
    // hidden_dim * n_mask_blocks) MaskBlocks, optional top_mlp on top.
    required MaskNetModule booster_masknet = 2;
    repeated TaskTower task_towers = 5;

    // ===== Light (pre-ranking net, training + inference) =====
    optional MLP light_mlp = 20;
    optional MLP light_task_mlp = 21;
    // Negative Sample Gate Unit on the light input (Eq.6). If unset, no gate.
    optional NSGate ns_gate = 37;

    // ===== Distillation (logit BCE = Eq.5; NO feature_based_sim) =====
    optional float hint_loss_weight = 32 [default = 1.0];
    repeated TaskDistillWeight task_distill_weights = 34;
    optional HintLossType hint_loss_type = 35 [default = HINT_BCE];

    // ===== Weighted Contrastive Loss (Eq.7+8), light only =====
    // α_w: total WCL weight in Eq.2 (multiplies every task's WCL term).
    optional float wcl_weight = 38 [default = 0.1];
    optional uint32 wcl_num_negatives = 39 [default = 8];
    optional float wcl_temperature = 40 [default = 0.1];
    optional float wcl_delta = 41 [default = 1.0];
    // opt-in per-task WCL config (a tower gets WCL only if listed here).
    repeated TaskWCLWeight task_wcl_weights = 42;
    // Additive logit margin for the Eq.7 InfoNCE (raw logit units); see
    // SDCLRocketLaunching.wcl_margin for the exact gradient-saturation
    // semantics (m < 0 = tolerance toward the data's effect size).
    optional float wcl_margin = 44 [default = 0.0];

    // Towers whose BOOSTER-side input is detached from the trunk
    // (masknet / share), so their task loss does NOT update the shared
    // bottom -- same booster-only semantics as SDCLRocketLaunching.
    repeated string detached_tower_names = 45;
}
