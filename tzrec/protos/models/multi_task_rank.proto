syntax = "proto2";
package tzrec.protos;

import "tzrec/protos/module.proto";
import "tzrec/protos/tower.proto";
import "tzrec/protos/loss.proto";
import "tzrec/protos/models/rank_model.proto";

message SimpleMultiTask {
    repeated TaskTower task_towers = 1;
}

message MMoE {
    // mmoe expert module definition
    required MLP expert_mlp = 1;
    // mmoe gate module definition
    optional MLP gate_mlp = 2;
    // number of mmoe experts
    required uint32 num_expert = 3 [default=3];
    // task tower
    repeated TaskTower task_towers = 4;
}

message DBMTL {
    // shared bottom MaskNet module
    optional MaskNetModule mask_net = 6;
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // bayes task tower
    repeated BayesTaskTower task_towers = 5;
}

message DBMTL_DCNv2 {
    // shared bottom MaskNet module
    optional MaskNetModule mask_net = 1;
    // shared bottom mlp layer
    optional MLP bottom_mlp = 2;
    // DCNv2 cross module
    required CrossV2 dcnv2 = 3;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 4;
    // mmoe gate module definition
    optional MLP gate_mlp = 5;
    // number of mmoe experts
    optional uint32 num_expert = 6 [default=3];
    // bayes task tower
    repeated BayesTaskTower task_towers = 7;
    // vector projections for compressing high-dimensional features
    repeated VectorProjection vector_projections = 8;
    // 概率排序约束惩罚权重（p(parent) >= p(child)），0 表示不启用
    optional float ordering_penalty_weight = 9 [default = 0.0];
}

message LHUCEPGateConfig {
    // feature names whose embeddings are used as gate input
    repeated string bias_feature_names = 1;
    // hidden units for gate MLP
    repeated uint32 hidden_units = 2;
}

message LHUCPPNetConfig {
    // PP net main network layer sizes (nn_dims)
    repeated uint32 hidden_units = 1;
    // gate MLP hidden layer sizes (lhuc_dims)
    repeated uint32 lhuc_hidden_units = 2;
    // activation function for nn layers
    optional string activation = 3 [default = "nn.ReLU"];
    // whether to apply additional sigmoid gating to last layer output
    optional bool scale_last = 4 [default = false];
    // dropout ratio
    optional float dropout_ratio = 5 [default = 0.0];
}

message SampleWeightFusion {
    // sample weight field names to fuse; must be a subset of sample_weight_fields
    repeated string weight_names = 1;
    // fusion coefficient per weight_name; length must match weight_names
    repeated float weight_coeffs = 2;
}

message BiasTask {
    // bias task name, used as prediction/loss key suffix (_bias_<name>)
    required string name = 1;
    // which task tower's representation the bias head branches from
    // (e.g. item_trend_bias -> is_click, price_bias -> is_conversion)
    required string target_tower = 2;
    // sample_weight field used as the supervision target (must be in
    // data_config.sample_weight_fields)
    required string target_field = 3;
    // bias head MLP (input = target_tower's representation)
    optional MLP mlp = 4;
    // loss for the bias task (l2_loss / binary_cross_entropy / ...)
    required LossConfig loss = 5;
    // loss weight
    optional float weight = 6 [default = 1.0];
    // output classes (1 for regression/L2, 2 for binary BCE)
    optional uint32 num_class = 7 [default = 1];
}

message DBMTL_LHUC {
    // shared bottom MaskNet module
    optional MaskNetModule mask_net = 1;
    // shared bottom mlp layer
    optional MLP bottom_mlp = 2;
    // DCNv2 cross module
    required CrossV2 dcnv2 = 3;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 4;
    // mmoe gate module definition
    optional MLP gate_mlp = 5;
    // number of mmoe experts
    optional uint32 num_expert = 6 [default=3];
    // bayes task tower
    repeated BayesTaskTower task_towers = 7;
    // LHUC EP gate config
    optional LHUCEPGateConfig lhuc_gate = 8;
    // LHUC PP net config
    optional LHUCPPNetConfig lhuc_pp_net = 12;
    // sample weight fusion config
    optional SampleWeightFusion sample_weight_fusion = 9;
    // extensible bias auxiliary tasks (predict bias fields as labels)
    repeated BiasTask bias_tasks = 13;
}

message DC2VR {
    // shared bottom mlp layer
    optional MLP bottom_mlp = 1;
    // mmoe expert mlp layer definition
    optional MLP expert_mlp = 2;
    // mmoe gate module definition
    optional MLP gate_mlp = 3;
    // number of mmoe experts
    optional uint32 num_expert = 4 [default=3];
    // task tower
    repeated InterventionTaskTower task_towers = 5;
}



message PLE {
    // extraction network
    repeated ExtractionNetwork extraction_networks = 1;
    // task tower
    repeated TaskTower task_towers = 2;
}


message DlrmHSTU {
    // hstu config
    required HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

message UltraHSTU {
    // Mixture of Transducers: one HSTU per channel; per-candidate
    // outputs are concatenated on the embedding dim.  >= 2 entries
    // requires every entry to set a unique non-empty `name` plus the
    // matching `<name>` / `<name>_action` / `<name>_watchtime` /
    // `<name>_timestamp` feature_groups.  Candidate-side and
    // contextual groups are shared across all channels.
    repeated HSTU hstu = 1;
    // multi task tower config
    required FusionMTLTower fusion_mtl_tower = 2;
    // max sequence length
    required uint32 max_seq_len = 3;
    // item embedding mlp hidden dimension
    optional uint32 item_embedding_hidden_dim = 4 [default = 512];
    // enables loss averaging computation globally across all ranks (total rank)
    // instead of locally (local rank).
    optional bool enable_global_average_loss = 5 [default = true];
    // timestamp of sequence is ascending or descending
    optional bool sequence_timestamp_is_ascending = 6 [default = true];
    // concat all contextual features on channel dim as one token
    optional bool concat_contextual_features = 7 [default = false];
}

message PEPNet {
    // epnet hidden units
    optional uint32 epnet_hidden_unit = 1;
    // activation function for epnet
    optional float  epnet_gamma = 2 [default = 2.0];
    // ppnet hidden units
    repeated uint32 ppnet_hidden_units = 3;
    // activation function for ppnet
    optional string ppnet_activation = 4 [default = 'nn.ReLU'];
    // ratio of dropout
    repeated float ppnet_dropout_ratio = 5;
    optional float  ppnet_gamma = 6 [default = 2.0];
    // domain feature name, must is num bucket
    optional string domain_input_name = 7;
    // domain number for each task
    optional uint32 task_domain_num = 8 [default = 1];
    // task tower
    repeated TaskTower task_towers = 9;
}
